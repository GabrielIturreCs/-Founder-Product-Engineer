<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios</title>
  </head>
  <body>
    <!-- Netlify Forms detecta este formulario al publicar. El sitio le envía los datos con fetch. -->
    <form name="guia" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
      <input name="nombre" />
      <input name="idioma" />
      <input name="origen" />
    </form>
    <form name="agenda" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="nombre" />
      <input name="email" type="email" />
      <textarea name="mensaje"></textarea>
      <input name="fecha" />
      <input name="hora" />
      <input name="idioma" />
    </form>
  </body>
</html>
